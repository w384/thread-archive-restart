name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: "${{ matrix.os }} · py${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.9", "3.12" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate skill structure
        run: python scripts/validate_skill.py .

      - name: Unit tests (stdlib unittest)
        run: python -m unittest discover -s tests -v

      - name: Smoke: --check on mixed fixture exits 3 (ARCHIVE)
        shell: bash
        run: |
          python scripts/measure_thread_context.py --check --sessions tests/fixtures/sessions >/dev/null
          code=$?
          echo "exit=$code (expected 3)"
          test "$code" -eq 3

      - name: Smoke: raised thresholds leave only WARN (exit 2)
        shell: bash
        run: |
          python scripts/measure_thread_context.py --check --sessions tests/fixtures/sessions \
            --threshold-turn 999999999 --threshold-cum 999999999 >/dev/null
          code=$?
          echo "exit=$code (expected 2)"
          test "$code" -eq 2